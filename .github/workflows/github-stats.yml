name: Refresh GitHub Stats

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Query and refresh contribution stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p data
          cat > refresh-stats.cjs <<'EOF'
          const fs = require('fs');

          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
            'User-Agent': 'github-stats-workflow',
          };

          const GITHUB_OWNER = process.env.GITHUB_REPOSITORY.split('/')[0];

          async function graphql(query, variables = {}) {
            const res = await fetch('https://api.github.com/graphql', {
              method: 'POST',
              headers,
              body: JSON.stringify({ query, variables }),
            });
            if (!res.ok) throw new Error(`GraphQL HTTP ${res.status}`);
            const json = await res.json();
            if (json.errors) throw new Error(JSON.stringify(json.errors));
            return json.data;
          }

          async function rest(path) {
            const res = await fetch(`https://api.github.com${path}`, { headers });
            if (!res.ok) throw new Error(`REST ${path} HTTP ${res.status}`);
            return res.json();
          }

          const levels = {
            NONE: 0,
            FIRST_QUARTILE: 1,
            SECOND_QUARTILE: 2,
            THIRD_QUARTILE: 3,
            FOURTH_QUARTILE: 4,
          };

          async function refreshRepos() {
            const repos = await rest(`/users/${GITHUB_OWNER}/repos?per_page=100&sort=updated`);
            const languageTotals = {};
            const slim = repos.map((r) => ({
              name: r.name,
              description: r.description,
              html_url: r.html_url,
              language: r.language,
              stargazers_count: r.stargazers_count,
              pushed_at: r.pushed_at,
            }));

            for (const repo of slim) {
              const langs = await rest(`/repos/${GITHUB_OWNER}/${encodeURIComponent(repo.name)}/languages`);
              Object.entries(langs).forEach(([lang, bytes]) => {
                languageTotals[lang] = (languageTotals[lang] || 0) + bytes;
              });
            }

            const out = {
              generatedAt: new Date().toISOString(),
              repos: slim,
              languageTotals,
            };

            fs.writeFileSync('data/github-repos.json', JSON.stringify(out, null, 2) + '\n');
            console.log(`Refreshed repos: ${slim.length} repos`);
          }

          async function main() {
            const profile = await graphql(`
              query($login: String!) {
                user(login: $login) {
                  createdAt
                  contributionsCollection {
                    contributionCalendar {
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                          contributionLevel
                        }
                      }
                    }
                  }
                }
              }
            `, { login: GITHUB_OWNER });

            const sumDays = (weeks) =>
              weeks.reduce((sum, w) => sum + w.contributionDays.reduce((s, d) => s + d.contributionCount, 0), 0);

            const collection = profile.user.contributionsCollection;
            const startYear = new Date(profile.user.createdAt).getFullYear();
            const endYear = new Date().getFullYear();

            const lastYearTotal = sumDays(collection.contributionCalendar.weeks);

            const weeks = collection.contributionCalendar.weeks.map((w) =>
              w.contributionDays.map((d) => ({
                date: d.date,
                count: d.contributionCount,
                level: levels[d.contributionLevel] !== undefined ? levels[d.contributionLevel] : 0,
              }))
            );

            let lifetime = 0;
            for (let y = startYear; y <= endYear; y++) {
              const yearly = await graphql(
                `query($login: String!, $from: DateTime!, $to: DateTime!) {
                  user(login: $login) {
                    contributionsCollection(from: $from, to: $to) {
                      contributionCalendar {
                        weeks {
                          contributionDays {
                            contributionCount
                          }
                        }
                      }
                    }
                  }
                }`,
                { login: GITHUB_OWNER, from: `${y}-01-01T00:00:00Z`, to: `${y + 1}-01-01T00:00:00Z` }
              );
              const yearlyTotal = sumDays(yearly.user.contributionsCollection.contributionCalendar.weeks);
              lifetime += yearlyTotal;
              console.log(`${y}: ${yearlyTotal}`);
            }

            const out = {
              generatedAt: new Date().toISOString(),
              lifetimeContributions: lifetime,
              lastYearTotalContributions: lastYearTotal,
              weeks,
            };

            fs.writeFileSync('data/github-contributions.json', JSON.stringify(out, null, 2) + '\n');
            console.log(`Refreshed: lifetime=${lifetime}, lastYear=${lastYearTotal}`);

            await refreshRepos();
          }

          main().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF
          node refresh-stats.cjs
          rm refresh-stats.cjs

      - name: Commit and push updated stats
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-contributions.json data/github-repos.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh GitHub stats"
            git push
          fi
